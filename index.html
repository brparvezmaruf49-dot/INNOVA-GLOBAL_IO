<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INNOVA.GLOBAL - Permanent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#07080a;display:flex;justify-content:center}
.app{width:100%;max-width:400px;background:#0f1012;min-height:100vh;border-left:1px solid #1e1e1e;border-right:1px solid #1e1e1e;padding:20px}
.gold{color:#E8C77A}.bg-gold{background:#E8C77A;color:#000;font-weight:900}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;margin-top:12px;cursor:pointer}
.card{background:#000;border:1px solid #222;border-radius:16px;padding:16px;margin-top:12px}
input{width:100%;padding:15px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>
<script>
const SUPABASE_URL="https://emnnltbzxzdutnisvzni.supabase.co";
const SUPABASE_KEY="sb_publishable_HJLbbhiiukwMjbhNDKfZOw_JyLRXgXj";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let temp={};
function show(id){['welcome','register','payment','login','dash','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id=='admin')loadAdmin();}

async function goPayment(){
 let n=document.getElementById('r_name').value.trim();
 let m=document.getElementById('r_mobile').value.trim();
 let p=document.getElementById('r_pass').value.trim();
 if(!n||!m||!p){alert("Name, Mobile, Password দাও");return;}
 temp={name:n,mobile:m,pass:p,ref:document.getElementById('r_ref').value.trim()};
 show('payment');
}

async function createID(){
 let sender=document.getElementById('p_sender').value.trim();
 let trx=document.getElementById('p_trx').value.trim();
 let btn=document.getElementById('create_btn');
 btn.innerText="Creating..."; btn.disabled=true;
 try{
   let {data:all} = await supabaseClient.from('members').select('innova_id').order('id',{ascending:true});
   let nextID = (!all||all.length==0)? "000001" : String(all.length+1).padStart(6,'0');
   let isFirst = nextID=="000001";
   if(!isFirst && (!sender||!trx)){alert("Sender & TrxID দাও"); btn.innerText="SUBMIT"; btn.disabled=false; return;}
   let {error} = await supabaseClient.from('members').insert([{
     innova_id:nextID,name:temp.name,mobile:temp.mobile,pass:temp.pass,ref:temp.ref,sender:sender||"FREE FOR 000001",trx:trx||"FREE FOR 000001",status:isFirst?"ACTIVE":"PENDING",role:isFirst?"admin":"member"
   }]);
   if(error) throw error;
   alert(isFirst?"✅ ROOT 000001 CREATED Permanent!":"✅ ID "+nextID+" Created - PENDING");
   show('login');
 }catch(e){alert("Error: "+e.message+" - Table বানিয়েছো তো? SQL Run করো"); }
 btn.innerText="SUBMIT → ID CREATE হবে"; btn.disabled=false;
}

async function doLogin(){
 let m=document.getElementById('l_mobile').value.trim();
 let p=document.getElementById('l_pass').value.trim();
 let {data,error}= await supabaseClient.from('members').select('*').eq('mobile',m).eq('pass',p).single();
 if(error||!data){alert("Mobile/Password ভুল");return;}
 if(data.status!="ACTIVE"){alert("PENDING - 000001 Approve করবে");return;}
 localStorage.setItem('current_user',JSON.stringify(data));
 document.getElementById('d_name').innerText=data.name;
 document.getElementById('d_id').innerText="ID: "+data.innova_id;
 document.getElementById('d_role').innerText=data.innova_id=="000001"?"ROOT ADMIN - ভিতরে Admin আছে":"MEMBER - Package 15 Days";
 if(data.innova_id=="000001")document.getElementById('admin_btn').classList.remove('hidden');
 else document.getElementById('admin_btn').classList.add('hidden');
 show('dash');
}

async function loadAdmin(){
 let cur=JSON.parse(localStorage.getItem('current_user')||'{}');
 if(cur.innova_id!="000001"){alert("Only 000001");show('welcome');return;}
 let {data:members}= await supabaseClient.from('members').select('*').order('id',{ascending:true});
 let pend=members.filter(x=>x.status=="PENDING");
 document.getElementById('a_total').innerText=members.length;
 document.getElementById('a_pending').innerText=pend.length;
 document.getElementById('pending_list').innerHTML=pend.map(x=>`<div class="card" style="border-color:#E8C77A"><b class="gold">${x.innova_id}</b> - ${x.name}<br>Mobile:${x.mobile}<br>Sender:${x.sender}<br>Trx:${x.trx}<br><button onclick="approve('${x.innova_id}')" class="btn bg-gold" style="padding:10px">APPROVE</button></div>`).join('')||"<p style='text-align:center;color:gray;padding:20px'>No Pending ✅</p>";
 document.getElementById('all_list').innerHTML=members.map(x=>`<div class="card" style="display:flex;justify-content:space-between;font-size:12px"><span class="gold">${x.innova_id}</span><span>${x.name}</span><span style="color:${x.status=='ACTIVE'?'#4ade80':'#facc15'}">${x.status}</span></div>`).join('');
}

async function approve(id){
 let {error}= await supabaseClient.from('members').update({status:"ACTIVE"}).eq('innova_id',id);
 if(error){alert(error.message);return;}
 alert("Approved "+id); loadAdmin();
}
</script>

<div id="welcome" class="app">
<h1 style="text-align:center;letter-spacing:4px;margin-top:20px">INNOVA.<span class="gold">GLOBAL</span></h1>
<p style="text-align:center;margin-top:20px;font-weight:900">Welcome to<br><span class="gold">INNOVA.GLOBAL</span></p>
<button class="btn bg-gold" onclick="show('register')">CREATE ACCOUNT</button>
<button class="btn" style="background:#1e1e1e;color:#E8C77A;border:2px solid #E8C77A" onclick="show('login')">LOGIN</button>
<div class="card"><p class="gold" style="font-size:12px">System: 000001 Auto Active + Admin Inside, 000002+ Need Approval | Permanent DB</p></div>
</div>

<div id="register" class="app hidden">
<h2 style="text-align:center">Create Account</h2>
<input id="r_name" placeholder="Full Name *"><input id="r_mobile" placeholder="Mobile *"><input id="r_pass" type="password" placeholder="Password *"><input id="r_ref" placeholder="Referral ID (First এ খালি)">
<button class="btn bg-gold" onclick="goPayment()">NEXT → PAYMENT</button>
<button class="btn" style="background:#222;color:#fff" onclick="show('welcome')">Back</button>
</div>

<div id="payment" class="app hidden">
<h2 style="text-align:center">Payment - 200 TK</h2>
<div class="card" style="text-align:center;border-color:#E8C77A"><p>bKash Personal</p><p class="gold" style="font-size:24px;font-weight:900">01313213083</p><p style="font-size:10px;color:gray">First ID 000001 Free</p></div>
<input id="p_sender" placeholder="Sender Number"><input id="p_trx" placeholder="TrxID">
<button id="create_btn" class="btn bg-gold" onclick="createID()">SUBMIT → ID CREATE হবে</button>
</div>

<div id="login" class="app hidden">
<h2 style="text-align:center;margin-top:30px">LOGIN</h2>
<input id="l_mobile" placeholder="Mobile"><input id="l_pass" type="password" placeholder="Password">
<button class="btn bg-gold" onclick="doLogin()">LOGIN</button>
</div>

<div id="dash" class="app hidden">
<h2 id="d_name" style="text-align:center">--</h2><p id="d_id" style="text-align:center" class="gold">--</p><p id="d_role" style="text-align:center;font-size:11px;color:gray">--</p>
<button id="admin_btn" class="btn bg-gold hidden" onclick="show('admin')">ADMIN PANEL - ONLY INSIDE 000001</button>
<button class="btn" style="background:#222;color:#fff" onclick="show('welcome')">Logout</button>
</div>

<div id="admin" class="app hidden">
<h2 style="text-align:center">ADMIN PANEL (000001)</h2>
<div style="display:flex;gap:10px;margin-top:10px"><div class="card" style="flex:1;text-align:center"><p id="a_total" class="gold">0</p><p style="font-size:10px">Total</p></div><div class="card" style="flex:1;text-align:center"><p id="a_pending" class="gold">0</p><p style="font-size:10px">Pending</p></div></div>
<div id="pending_list"></div><div id="all_list"></div>
<button class="btn" style="background:#222;color:#fff" onclick="show('dash')">Back</button>
</div>

</body>
</html>

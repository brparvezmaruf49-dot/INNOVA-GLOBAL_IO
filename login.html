<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - INNOVA</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.gold{color:#FFD700}.bg-gold{background:#FFD700}.border-gold{border-color:#FFD700}</style></head>
<body class="bg-black text-white flex justify-center p-4">
<div class="w-full max-w-md bg-zinc-900 border border-gold rounded-2xl p-6 mt-10">
<h2 class="text-2xl font-bold text-center gold">MEMBER LOGIN</h2>
<input id="mobile" placeholder="Mobile Number" class="w-full mt-6 p-3 rounded-lg bg-black border border-zinc-700">
<input id="pass" type="password" placeholder="Password" class="w-full mt-3 p-3 rounded-lg bg-black border border-zinc-700">
<button onclick="login()" id="btn" class="w-full mt-6 bg-gold text-black font-bold p-3 rounded-xl">Login</button>
<p class="text-center text-sm mt-4">No account? <a href="register.html" class="gold">Create</a></p>
<p id="msg" class="text-center text-sm mt-3 text-red-400"></p>
</div>
<script>
const supa = supabase.createClient("https://emnnltbzxzdutnisvzni.supabase.co","sb_publishable_HJLbbhiiukwMjbhNDKfZOw_JyLRXgXj");
async function login(){
  let m=document.getElementById('mobile').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(!m||!p){alert("Mobile + Password দাও");return;}
  document.getElementById('btn').innerText="Checking...";
  let {data,error} = await supa.from('profiles').select('*').eq('mobile',m).eq('password',p).single();
  if(!data){document.getElementById('msg').innerText="ভুল Mobile বা Password"; document.getElementById('btn').innerText="Login"; return;}
  localStorage.setItem('mobile',m);
  localStorage.setItem('innova_id',data.innova_id);
  localStorage.setItem('role',data.role);
  if(data.role=='admin' && data.innova_id=='000001'){
    location.href='admin.html';
  }else{
    location.href='dashboard.html';
  }
}
</script></body></html>
